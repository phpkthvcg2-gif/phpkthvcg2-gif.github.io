<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>口腔溃疡预防健康管理 V1.4</title>
  <!-- PWA配置 -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="口腔健康记录">
  <meta name="theme-color" content="#2c9f6f">
  <meta name="description" content="口腔溃疡预防健康管理，记录每日饮食作息，守护口腔健康">
  <style>
/* ============================================
   口腔溃疡预防健康管理APP - 全局样式
   健康简约风格，电脑端优先
   ============================================ */

/* ---------- 全局重置 ---------- */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

:root {
  --primary: #2c9f6f;
  --primary-light: #e8f8f0;
  --primary-dark: #1e7a52;
  --text-main: #2c3e50;
  --text-sub: #7f8c8d;
  --text-light: #bdc3c7;
  --bg-page: #f5f7fa;
  --bg-card: #ffffff;
  --border: #e8ecf1;
  --shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
  --shadow-hover: 0 4px 20px rgba(0, 0, 0, 0.1);
  --radius: 12px;
  --radius-sm: 8px;

  /* 风险等级配色 */
  --risk-healthy: #2ecc71;
  --risk-healthy-bg: #eafaf1;
  --risk-low: #f1c40f;
  --risk-low-bg: #fef9e7;
  --risk-mid: #e67e22;
  --risk-mid-bg: #fdf2e9;
  --risk-high: #e74c3c;
  --risk-high-bg: #fdedec;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
    "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  background-color: var(--bg-page);
  color: var(--text-main);
  line-height: 1.6;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

/* ---------- 页面容器 ---------- */
.app-container {
  max-width: 960px;
  margin: 0 auto;
  padding: 24px 20px 60px;
}

/* ---------- 页头 ---------- */
.app-header {
  text-align: center;
  margin-bottom: 28px;
}

.app-header h1 {
  font-size: 26px;
  font-weight: 700;
  color: var(--primary-dark);
  margin-bottom: 6px;
  letter-spacing: 1px;
}

.app-header .subtitle {
  font-size: 14px;
  color: var(--text-sub);
}

/* ---------- 通用卡片 ---------- */
.card {
  background: var(--bg-card);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 24px;
  margin-bottom: 20px;
}

/* ---------- 按钮 ---------- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 10px 22px;
  font-size: 14px;
  font-weight: 600;
  border: none;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all 0.2s ease;
  user-select: none;
}

.btn-primary {
  background: var(--primary);
  color: #fff;
}

.btn-primary:hover {
  background: var(--primary-dark);
  transform: translateY(-1px);
  box-shadow: 0 4px 12px rgba(44, 159, 111, 0.3);
}

.btn-primary:active {
  transform: translateY(0);
}

.btn-secondary {
  background: var(--bg-page);
  color: var(--text-main);
  border: 1px solid var(--border);
}

.btn-secondary:hover {
  background: var(--primary-light);
  border-color: var(--primary);
  color: var(--primary-dark);
}

.btn-ghost {
  background: transparent;
  color: var(--text-sub);
  padding: 8px 14px;
}

.btn-ghost:hover {
  color: var(--primary);
  background: var(--primary-light);
}

.btn-block {
  width: 100%;
}

.btn-lg {
  padding: 14px 32px;
  font-size: 16px;
}

/* ---------- 今日记录入口区 ---------- */
.record-entry {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
}

.record-entry .entry-info h2 {
  font-size: 18px;
  font-weight: 700;
  margin-bottom: 4px;
}

.record-entry .entry-info p {
  font-size: 13px;
  color: var(--text-sub);
}

/* ---------- 日历模块 ---------- */
.calendar-card {
  padding: 20px;
}

.calendar-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 18px;
}

.calendar-title {
  font-size: 18px;
  font-weight: 700;
  color: var(--text-main);
}

.calendar-nav {
  display: flex;
  align-items: center;
  gap: 8px;
}

.calendar-nav button {
  width: 36px;
  height: 36px;
  padding: 0;
  font-size: 18px;
  border-radius: 50%;
}

.calendar-today-btn {
  width: auto !important;
  padding: 0 14px !important;
  font-size: 13px !important;
  border-radius: var(--radius-sm) !important;
}

/* 星期表头 */
.calendar-weekdays {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 4px;
  margin-bottom: 8px;
}

.calendar-weekdays div {
  text-align: center;
  font-size: 13px;
  font-weight: 600;
  color: var(--text-sub);
  padding: 8px 0;
}

.calendar-weekdays .weekend {
  color: var(--risk-high);
}

/* 日历网格 */
.calendar-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 4px;
}

.calendar-cell {
  position: relative;
  min-height: 82px;
  padding: 8px 6px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all 0.15s ease;
  background: #fff;
  display: flex;
  flex-direction: column;
}

.calendar-cell:hover {
  border-color: var(--primary);
  box-shadow: 0 2px 8px rgba(44, 159, 111, 0.15);
  transform: translateY(-1px);
}

.calendar-cell.other-month {
  background: var(--bg-page);
  opacity: 0.45;
}

.calendar-cell.other-month:hover {
  opacity: 0.7;
}

.calendar-cell.today {
  border-color: var(--primary);
  border-width: 2px;
  background: var(--primary-light);
}

.calendar-cell.today .cell-date {
  color: var(--primary-dark);
  font-weight: 700;
}

.cell-date {
  font-size: 14px;
  font-weight: 500;
  color: var(--text-main);
}

.cell-score {
  position: absolute;
  top: 6px;
  right: 6px;
  font-size: 12px;
  font-weight: 700;
  padding: 2px 7px;
  border-radius: 10px;
  line-height: 1.4;
}

.cell-score.no-record {
  color: var(--text-light);
  background: transparent;
  font-weight: 400;
  font-size: 11px;
}

.cell-score.risk-healthy {
  color: var(--risk-healthy);
  background: var(--risk-healthy-bg);
}

.cell-score.risk-low {
  color: #b7950b;
  background: var(--risk-low-bg);
}

.cell-score.risk-mid {
  color: var(--risk-mid);
  background: var(--risk-mid-bg);
}

.cell-score.risk-high {
  color: var(--risk-high);
  background: var(--risk-high-bg);
}

.cell-weekend .cell-date {
  color: var(--risk-high);
}

/* ---------- 记录填报模块 ---------- */
.record-section {
  display: none;
}

.record-section.active {
  display: block;
}

.record-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 12px;
}

.record-header h2 {
  font-size: 20px;
  font-weight: 700;
}

.record-date {
  font-size: 14px;
  color: var(--text-sub);
}

/* 分数汇总条 */
.score-summary {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 18px 22px;
  border-radius: var(--radius);
  margin-bottom: 22px;
  flex-wrap: wrap;
  gap: 12px;
}

.score-summary .score-number {
  font-size: 36px;
  font-weight: 800;
  line-height: 1;
}

.score-summary .score-label {
  font-size: 13px;
  opacity: 0.8;
  margin-top: 4px;
}

.score-summary .risk-badge {
  font-size: 16px;
  font-weight: 700;
  padding: 8px 20px;
  border-radius: 20px;
}

.score-summary.summary-healthy {
  background: var(--risk-healthy-bg);
}
.score-summary.summary-healthy .score-number,
.score-summary.summary-healthy .score-label {
  color: var(--risk-healthy);
}

.score-summary.summary-low {
  background: var(--risk-low-bg);
}
.score-summary.summary-low .score-number,
.score-summary.summary-low .score-label {
  color: #b7950b;
}

.score-summary.summary-mid {
  background: var(--risk-mid-bg);
}
.score-summary.summary-mid .score-number,
.score-summary.summary-mid .score-label {
  color: var(--risk-mid);
}

.score-summary.summary-high {
  background: var(--risk-high-bg);
}
.score-summary.summary-high .score-number,
.score-summary.summary-high .score-label {
  color: var(--risk-high);
}

/* 评分项分组 */
.score-group {
  margin-bottom: 20px;
}

.score-group-title {
  font-size: 14px;
  font-weight: 700;
  color: var(--primary-dark);
  margin-bottom: 10px;
  padding-left: 10px;
  border-left: 3px solid var(--primary);
}

.score-item {
  display: flex;
  align-items: center;
  padding: 14px 16px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  margin-bottom: 8px;
  cursor: pointer;
  transition: all 0.15s ease;
  background: #fff;
}

.score-item:hover {
  border-color: var(--primary);
  background: var(--primary-light);
}

.score-item.checked {
  border-color: var(--primary);
  background: var(--primary-light);
}

.score-item input[type="checkbox"] {
  width: 20px;
  height: 20px;
  margin-right: 14px;
  cursor: pointer;
  accent-color: var(--primary);
  flex-shrink: 0;
}

.score-item .item-info {
  flex: 1;
}

.score-item .item-name {
  font-size: 15px;
  font-weight: 500;
  color: var(--text-main);
}

.score-item .item-desc {
  font-size: 12px;
  color: var(--text-sub);
  margin-top: 2px;
}

.score-item .item-score {
  font-size: 14px;
  font-weight: 700;
  color: var(--primary);
  background: var(--primary-light);
  padding: 4px 10px;
  border-radius: 12px;
  flex-shrink: 0;
}

/* 提交区 */
.record-actions {
  display: flex;
  gap: 12px;
  margin-top: 24px;
  flex-wrap: wrap;
}

.save-tip {
  font-size: 12px;
  color: var(--text-sub);
  margin-top: 10px;
  text-align: center;
}

/* ---------- 弹窗 ---------- */
.modal-overlay {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: rgba(0, 0, 0, 0.45);
  z-index: 1000;
  align-items: center;
  justify-content: center;
  padding: 20px;
  animation: fadeIn 0.2s ease;
}

.modal-overlay.active {
  display: flex;
}

.modal {
  background: #fff;
  border-radius: var(--radius);
  box-shadow: 0 8px 40px rgba(0, 0, 0, 0.2);
  width: 100%;
  max-width: 520px;
  max-height: 85vh;
  overflow-y: auto;
  animation: slideUp 0.25s ease;
}

.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 20px 24px;
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  background: #fff;
  z-index: 1;
}

.modal-header h3 {
  font-size: 18px;
  font-weight: 700;
}

.modal-close {
  width: 32px;
  height: 32px;
  padding: 0;
  font-size: 20px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
}

.modal-body {
  padding: 24px;
}

.modal-footer {
  padding: 16px 24px;
  border-top: 1px solid var(--border);
  text-align: right;
}

/* 弹窗内记录详情 */
.detail-score-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 20px;
  border-radius: var(--radius-sm);
  margin-bottom: 20px;
}

.detail-score-row .detail-score-num {
  font-size: 32px;
  font-weight: 800;
}

.detail-items-list .detail-item {
  display: flex;
  align-items: center;
  padding: 12px 0;
  border-bottom: 1px solid var(--border);
  font-size: 14px;
}

.detail-items-list .detail-item:last-child {
  border-bottom: none;
}

.detail-item .detail-status {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  font-weight: 700;
  margin-right: 12px;
  flex-shrink: 0;
}

.detail-item .detail-status.done {
  background: var(--risk-healthy-bg);
  color: var(--risk-healthy);
}

.detail-item .detail-status.undone {
  background: var(--bg-page);
  color: var(--text-light);
}

.detail-item .detail-item-name {
  flex: 1;
}

.detail-item .detail-item-score {
  font-size: 13px;
  color: var(--text-sub);
  font-weight: 600;
}

/* 空状态 */
.empty-state {
  text-align: center;
  padding: 40px 20px;
  color: var(--text-sub);
}

.empty-state .empty-icon {
  font-size: 48px;
  margin-bottom: 12px;
  opacity: 0.5;
}

.empty-state p {
  font-size: 14px;
}

/* ---------- 提示消息 ---------- */
.toast {
  position: fixed;
  top: 24px;
  left: 50%;
  transform: translateX(-50%) translateY(-20px);
  background: var(--text-main);
  color: #fff;
  padding: 12px 24px;
  border-radius: var(--radius-sm);
  font-size: 14px;
  font-weight: 500;
  z-index: 2000;
  opacity: 0;
  transition: all 0.3s ease;
  pointer-events: none;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
}

.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

.toast.success {
  background: var(--risk-healthy);
}

.toast.error {
  background: var(--risk-high);
}

/* ---------- 动画 ---------- */
@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

@keyframes slideUp {
  from {
    opacity: 0;
    transform: translateY(20px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* ---------- 页脚 ---------- */
.app-footer {
  text-align: center;
  padding: 20px;
  font-size: 12px;
  color: var(--text-light);
}

/* ---------- V1.4-PWA新增：数据备份操作区 ---------- */
.backup-section {
  padding: 20px 24px;
}

.backup-title {
  font-size: 16px;
  font-weight: 700;
  color: var(--text-main);
  margin-bottom: 8px;
}

.backup-desc {
  font-size: 13px;
  color: var(--text-sub);
  margin-bottom: 14px;
  line-height: 1.6;
}

.backup-buttons {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
}

/* ---------- 滚动条美化 ---------- */
::-webkit-scrollbar {
  width: 8px;
  height: 8px;
}

::-webkit-scrollbar-track {
  background: var(--bg-page);
}

::-webkit-scrollbar-thumb {
  background: var(--text-light);
  border-radius: 4px;
}

::-webkit-scrollbar-thumb:hover {
  background: var(--text-sub);
}

/* ---------- V1.4新增：症状单选组样式 ---------- */
.symptom-section {
  margin-top: 20px;
  padding-top: 16px;
  border-top: 1px solid var(--border);
}

.symptom-group-title {
  font-size: 14px;
  font-weight: 700;
  color: var(--primary-dark);
  margin-bottom: 12px;
  padding-left: 10px;
  border-left: 3px solid var(--primary);
}

.symptom-options {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
}

.symptom-option {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 10px 18px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all 0.15s ease;
  background: #fff;
}

.symptom-option:hover {
  border-color: var(--primary);
  background: var(--primary-light);
}

.symptom-option.selected {
  border-color: var(--primary);
  background: var(--primary-light);
  font-weight: 600;
}

.symptom-option input[type="radio"] {
  width: 18px;
  height: 18px;
  cursor: pointer;
  accent-color: var(--primary);
}

.symptom-label {
  font-size: 15px;
  font-weight: 600;
}

/* ---------- V1.4新增：日历单元格症状文字样式 ---------- */
.cell-symptom {
  font-size: 11px;
  margin-top: 4px;
  font-weight: 600;
  line-height: 1.3;
}

.cell-symptom.symptom-none { color: #2ecc71; }
.cell-symptom.symptom-slight { color: #f1c40f; }
.cell-symptom.symptom-mid { color: #e67e22; }
.cell-symptom.symptom-severe { color: #e74c3c; }

/* ---------- V1.4新增：提交反馈弹窗样式 ---------- */
.submit-feedback-modal .modal-body {
  padding: 24px;
}

.feedback-score-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 20px;
  border-radius: var(--radius-sm);
  margin-bottom: 16px;
}

.feedback-score-num {
  font-size: 36px;
  font-weight: 800;
  line-height: 1;
}

.feedback-risk-badge {
  font-size: 16px;
  font-weight: 700;
  padding: 8px 20px;
  border-radius: 20px;
  background: #fff;
}

.feedback-unchecked-title {
  font-size: 14px;
  font-weight: 700;
  color: var(--text-main);
  margin-bottom: 8px;
}

.feedback-unchecked-list {
  list-style: none;
  padding: 0;
  margin: 0;
}

.feedback-unchecked-list li {
  padding: 6px 0;
  font-size: 14px;
  color: var(--text-sub);
  border-bottom: 1px solid var(--border);
}

.feedback-unchecked-list li:last-child {
  border-bottom: none;
}

.feedback-unchecked-list li::before {
  content: '⚠️ ';
  margin-right: 4px;
}

.feedback-all-pass {
  text-align: center;
  padding: 20px;
  font-size: 16px;
  font-weight: 600;
  color: var(--risk-healthy);
}

</style>
</head>
<body>
  <div class="app-container">
    <!-- 页头 -->
    <header class="app-header">
      <h1>口腔溃疡预防健康管理</h1>
      <p class="subtitle">记录每日饮食作息，守护口腔健康</p>
    </header>

    <!-- ========== 首页视图 ========== -->
    <div id="home-view">
      <!-- 今日记录入口 -->
      <div class="card record-entry">
        <div class="entry-info">
          <h2>今日饮食作息记录</h2>
          <p>勾选今日达标项，自动计算健康评分</p>
        </div>
        <button class="btn btn-primary btn-lg" id="btn-go-record">
          开始记录今日
        </button>
      </div>

      <!-- 日历模块 -->
      <div class="card calendar-card">
        <div class="calendar-header">
          <div class="calendar-title" id="calendar-title">2026年9月</div>
          <div class="calendar-nav">
            <button class="btn btn-ghost" id="btn-prev-month" title="上个月">‹</button>
            <button class="btn btn-ghost calendar-today-btn" id="btn-today-month">今天</button>
            <button class="btn btn-ghost" id="btn-next-month" title="下个月">›</button>
          </div>
        </div>

        <!-- 星期表头（V1.3：周一开头，顺序 一、二、三、四、五、六、日） -->
        <div class="calendar-weekdays">
          <div>一</div>
          <div>二</div>
          <div>三</div>
          <div>四</div>
          <div>五</div>
          <div>六</div>
          <div class="weekend">日</div>
        </div>

        <!-- 日历网格（JS动态渲染） -->
        <div class="calendar-grid" id="calendar-grid"></div>
      </div>
    </div>

    <!-- ========== 记录填报视图 ========== -->
    <div id="record-view" class="record-section">
      <div class="card">
        <div class="record-header">
          <div>
            <h2>今日饮食作息记录</h2>
            <div class="record-date" id="record-date-label">2026年9月10日</div>
          </div>
          <button class="btn btn-secondary" id="btn-back-home">
            ← 返回日历
          </button>
        </div>

        <!-- 分数汇总 -->
        <div class="score-summary summary-high" id="score-summary">
          <div>
            <div class="score-number" id="current-score">0</div>
            <div class="score-label">今日健康评分（满分100）</div>
          </div>

  <script>
/**
 * 口腔溃疡预防健康管理APP - 核心逻辑模块
 * 包含：评分配置、计分逻辑、风险等级判定、日期处理、本地存储封装
 * 兼容浏览器与 Node.js 测试环境
 */
(function (global, factory) {
  if (typeof module === 'object' && typeof module.exports === 'object') {
    module.exports = factory();
  } else {
    global.OralCareCore = factory();
  }
})(typeof window !== 'undefined' ? window : this, function () {
  'use strict';

  // ========== 1. 评分项配置（V1.4：13项，严格匹配PRD） ==========
  var SCORE_ITEMS = [
    { id: 'green_veg',       name: 'B族食补：深绿蔬菜＞200g',                                    category: 'B族维生素', score: 7  },
    { id: 'coarse_grain',    name: 'B族食补：主食含1/3粗粮',                                      category: 'B族维生素', score: 6  },
    { id: 'b_vitamin',       name: 'B族补剂：按需服OTC复合B族1片，不长期过量',                   category: 'B族维生素', score: 4  },
    { id: 'fruit',           name: '水果200～350g，少高酸鲜果',                                   category: '营养摄入',   score: 5  },
    { id: 'meat_fish',       name: '锌铁蛋白：瘦肉/鱼虾/贝类＞100g',                              category: '营养摄入',   score: 7  },
    { id: 'egg',             name: '鸡蛋≥1个',                                                     category: '营养摄入',   score: 4  },
    { id: 'night_sleep',     name: '夜间睡眠≥7h，尽量23点前入睡',                                 category: '作息',       score: 22 },
    { id: 'nap',             name: '午休15～20min，不超30min',                                    category: '作息',       score: 5  },
    { id: 'avoid_irritant',  name: '黏膜防护忌口：不吃油炸坚硬干硬食物；禁酒、辣、过烫食物，少甜食', category: '黏膜防护', score: 11 },
    { id: 'oral_clean',      name: '口腔清洁：早晚刷牙，饭后漱口',                                 category: '口腔护理',   score: 6  },
    { id: 'exercise',        name: '规律运动：每日等效快走10分钟，不超负荷',                       category: '运动',       score: 13 },
    { id: 'stress_control',  name: '压力管控：单次连续工作思考≤2h，中途休息',                      category: '压力管理',   score: 6  },
    { id: 'water',           name: '饮水1500–2000ml，保持黏膜湿润',                               category: '饮水',       score: 4  }
  ];

  // ========== 1.1 症状选项配置（V1.4新增，不计分） ==========
  var SYMPTOM_OPTIONS = [
    { value: '无',   color: '#2ecc71', cssClass: 'symptom-none'   },
    { value: '轻微', color: '#f1c40f', cssClass: 'symptom-slight' },
    { value: '中度', color: '#e67e22', cssClass: 'symptom-mid'    },
    { value: '重度', color: '#e74c3c', cssClass: 'symptom-severe' }
  ];

  // 满分校验
  var TOTAL_MAX_SCORE = SCORE_ITEMS.reduce(function (sum, item) {
    return sum + item.score;
  }, 0);

  // ========== 2. 风险等级配置（严格匹配PRD阈值） ==========
  var RISK_LEVELS = [
    { min: 80, max: 100, level: '健康',   color: '#2ecc71', bgColor: '#eafaf1' },
    { min: 70, max: 79,  level: '低风险', color: '#f1c40f', bgColor: '#fef9e7' },
    { min: 60, max: 69,  level: '中风险', color: '#e67e22', bgColor: '#fdf2e9' },
    { min: 0,  max: 59,  level: '高风险', color: '#e74c3c', bgColor: '#fdedec' }
  ];

  // ========== 3. 计分逻辑 ==========
  /**
   * 根据勾选状态计算总分
   * @param {Object} checkedMap - { itemId: true/false }
   * @returns {number} 总分（0-100）
   */
  function calculateScore(checkedMap) {
    if (!checkedMap || typeof checkedMap !== 'object') {
      return 0;
    }
    var total = 0;
    for (var i = 0; i < SCORE_ITEMS.length; i++) {
      var item = SCORE_ITEMS[i];
      if (checkedMap[item.id] === true) {
        total += item.score;
      }
    }
    // 防御：不超过满分
    return Math.min(total, TOTAL_MAX_SCORE);
  }

  /**
   * 获取单项分值
   * @param {string} itemId
   * @returns {number}
   */
  function getItemScore(itemId) {
    for (var i = 0; i < SCORE_ITEMS.length; i++) {
      if (SCORE_ITEMS[i].id === itemId) {
        return SCORE_ITEMS[i].score;
      }
    }
    return 0;
  }

  // ========== 4. 风险等级判定 ==========
  /**
   * 根据分数判定风险等级
   * @param {number} score
   * @returns {Object} { level, color, bgColor, min, max }
   */
  function getRiskLevel(score) {
    var s = Number(score);
    if (isNaN(s) || s < 0) s = 0;
    if (s > TOTAL_MAX_SCORE) s = TOTAL_MAX_SCORE;

    for (var i = 0; i < RISK_LEVELS.length; i++) {
      if (s >= RISK_LEVELS[i].min && s <= RISK_LEVELS[i].max) {
        return {
          level: RISK_LEVELS[i].level,
          color: RISK_LEVELS[i].color,
          bgColor: RISK_LEVELS[i].bgColor,
          min: RISK_LEVELS[i].min,
          max: RISK_LEVELS[i].max
        };
      }
    }
    // 兜底返回高风险
    return {
      level: '高风险', color: '#e74c3c', bgColor: '#fdedec', min: 0, max: 59
    };
  }

  // ========== 5. 日期处理 ==========
  /**
   * 格式化日期为 YYYY-MM-DD（作为存储唯一键）
   * 使用鸭子类型检查，兼容跨上下文（如jsdom测试环境）的Date对象
   * @param {Date} date
   * @returns {string}
   */
  function formatDateKey(date) {
    var isValidDate = date && typeof date.getTime === 'function' && !isNaN(date.getTime());
    if (!isValidDate) {
      date = new Date();
    }
    var y = date.getFullYear();
    var m = String(date.getMonth() + 1).padStart(2, '0');
    var d = String(date.getDate()).padStart(2, '0');
    return y + '-' + m + '-' + d;
  }

  /**
   * 解析日期键为 Date 对象
   * @param {string} key - YYYY-MM-DD
   * @returns {Date}
   */
  function parseDateKey(key) {
    var parts = String(key).split('-');
    if (parts.length !== 3) return new Date('Invalid');
    var y = parseInt(parts[0], 10);
    var m = parseInt(parts[1], 10) - 1;
    var d = parseInt(parts[2], 10);
    return new Date(y, m, d);
  }

  /**
   * 获取指定年月的日历数据（6行x7列）
   * V1.3：周一为每周第一天，列顺序：一、二、三、四、五、六、日
   * @param {number} year
   * @param {number} month - 0-11
   * @returns {Array} 二维数组，每个元素 { date, dateKey, isCurrentMonth, isToday }
   */
  function getCalendarGrid(year, month) {
    var today = new Date();
    var todayKey = formatDateKey(today);

    var firstDay = new Date(year, month, 1);
    // getDay(): 0=周日, 1=周一, ..., 6=周六
    // 转换为周一开头索引：周日->6, 周一->0, 周二->1, ..., 周六->5
    var firstWeekday = (firstDay.getDay() + 6) % 7;
    var daysInMonth = new Date(year, month + 1, 0).getDate();
    var daysInPrevMonth = new Date(year, month, 0).getDate();

    var grid = [];
    var dayCounter = 1;
    var nextMonthDay = 1;

    for (var row = 0; row < 6; row++) {
      var weekRow = [];
      for (var col = 0; col < 7; col++) {
        var cellDate, isCurrentMonth, dateObj;

        if (row === 0 && col < firstWeekday) {
          // 上月填充
          var prevDay = daysInPrevMonth - firstWeekday + col + 1;
          dateObj = new Date(year, month - 1, prevDay);
          isCurrentMonth = false;
        } else if (dayCounter > daysInMonth) {
          // 下月填充
          dateObj = new Date(year, month + 1, nextMonthDay);
          nextMonthDay++;
          isCurrentMonth = false;
        } else {
          // 当月
          dateObj = new Date(year, month, dayCounter);
          dayCounter++;
          isCurrentMonth = true;
        }

        weekRow.push({
          date: dateObj.getDate(),
          dateKey: formatDateKey(dateObj),
          isCurrentMonth: isCurrentMonth,
          isToday: formatDateKey(dateObj) === todayKey
        });
      }
      grid.push(weekRow);
    }
    return grid;
  }

  /**
   * 获取月份显示文本
   */
  function getMonthLabel(year, month) {
    return year + '年' + (month + 1) + '月';
  }

  // ========== 6. 本地存储封装 ==========
  var STORAGE_KEY = 'oral_care_records_v1';

  /**
   * 获取 localStorage 引用（兼容各种环境）
   * 优先使用 window.localStorage，兼容测试环境中被覆盖的情况
   */
  function getStorage() {
    try {
      if (typeof window !== 'undefined' && window.localStorage) {
        return window.localStorage;
      }
      if (typeof localStorage !== 'undefined') {
        return localStorage;
      }
      return null;
    } catch (e) {
      return null;
    }
  }

  /**
   * 读取全部记录
   * @returns {Object} { dateKey: { checkedMap, score, riskLevel, symptom, savedAt } }
   */
  function getAllRecords() {
    try {
      var storage = getStorage();
      if (!storage) return {};
      var raw = storage.getItem(STORAGE_KEY);
      if (!raw) return {};
      var parsed = JSON.parse(raw);
      if (!parsed || typeof parsed !== 'object') return {};
      // V1.4：兼容旧记录，没有symptom字段的默认填充"无"
      for (var key in parsed) {
        if (parsed.hasOwnProperty(key) && !parsed[key].symptom) {
          parsed[key].symptom = '无';
        }
      }
      return parsed;
    } catch (e) {
      return {};
    }
  }

  /**
   * 读取指定日期记录
   * @param {string} dateKey
   * @returns {Object|null}
   */
  function getRecord(dateKey) {
    var all = getAllRecords();
    return all[dateKey] || null;
  }

  /**
   * 保存单日记录（覆盖当日）
   * @param {string} dateKey
   * @param {Object} record - { checkedMap, score, riskLevel, symptom }
   * @returns {boolean} 是否保存成功
   */
  function saveRecord(dateKey, record) {
    if (!dateKey || !record || typeof record !== 'object') {
      return false;
    }
    try {
      var storage = getStorage();
      if (!storage) return false;
      var all = getAllRecords();
      // V1.4：兼容旧记录，symptom默认填充"无"
      var symptom = record.symptom || '无';
      all[dateKey] = {
        checkedMap: record.checkedMap || {},
        score: typeof record.score === 'number' ? record.score : calculateScore(record.checkedMap),
        riskLevel: record.riskLevel || getRiskLevel(record.score || 0).level,
        symptom: symptom,
        savedAt: new Date().toISOString()
      };
      storage.setItem(STORAGE_KEY, JSON.stringify(all));
      return true;
    } catch (e) {
      return false;
    }
  }

  /**
   * 清空全部记录（测试用）
   */
  function clearAllRecords() {
    try {
      var storage = getStorage();
      if (storage) {
        storage.removeItem(STORAGE_KEY);
      }
      return true;
    } catch (e) {
      return false;
    }
  }

  // ========== 导出 ==========
  return {
    SCORE_ITEMS: SCORE_ITEMS,
    SYMPTOM_OPTIONS: SYMPTOM_OPTIONS,
    TOTAL_MAX_SCORE: TOTAL_MAX_SCORE,
    RISK_LEVELS: RISK_LEVELS,
    calculateScore: calculateScore,
    getItemScore: getItemScore,
    getRiskLevel: getRiskLevel,
    formatDateKey: formatDateKey,
    parseDateKey: parseDateKey,
    getCalendarGrid: getCalendarGrid,
    getMonthLabel: getMonthLabel,
    getAllRecords: getAllRecords,
    getRecord: getRecord,
    saveRecord: saveRecord,
    clearAllRecords: clearAllRecords,
    STORAGE_KEY: STORAGE_KEY
  };
});

</script>
  <script>
/**
 * 口腔溃疡预防健康管理APP - UI交互逻辑
 * 依赖 core.js（OralCareCore）
 */
(function () {
  'use strict';

  var Core = window.OralCareCore;
  if (!Core) {
    console.error('OralCareCore 未加载');
    return;
  }

  // ========== 全局状态 ==========
  var state = {
    currentYear: new Date().getFullYear(),
    currentMonth: new Date().getMonth(), // 0-11
    todayKey: Core.formatDateKey(new Date()),
    currentView: 'home', // 'home' | 'record'
    editingDateKey: null // V1.3：当前正在编辑的日期key（今日或历史补录日期）
  };

  // ========== DOM 引用 ==========
  var dom = {};

  function initDom() {
    dom.calendarGrid = document.getElementById('calendar-grid');
    dom.calendarTitle = document.getElementById('calendar-title');
    dom.btnPrevMonth = document.getElementById('btn-prev-month');
    dom.btnNextMonth = document.getElementById('btn-next-month');
    dom.btnTodayMonth = document.getElementById('btn-today-month');
    dom.btnGoRecord = document.getElementById('btn-go-record');
    dom.btnBackHome = document.getElementById('btn-back-home');
    dom.homeView = document.getElementById('home-view');
    dom.recordView = document.getElementById('record-view');
    dom.recordDateLabel = document.getElementById('record-date-label');
    dom.scoreItemsContainer = document.getElementById('score-items-container');
    dom.symptomContainer = document.getElementById('symptom-container');
    dom.currentScore = document.getElementById('current-score');
    dom.riskBadge = document.getElementById('risk-badge');
    dom.scoreSummary = document.getElementById('score-summary');
    dom.btnSaveRecord = document.getElementById('btn-save-record');
    dom.detailModal = document.getElementById('detail-modal');
    dom.modalTitle = document.getElementById('modal-title');
    dom.modalBody = document.getElementById('modal-body');
    dom.modalClose = document.getElementById('modal-close');
    dom.modalOk = document.getElementById('modal-ok');
    dom.toast = document.getElementById('toast');
    // V1.4：提交反馈弹窗
    dom.submitFeedbackModal = document.getElementById('submit-feedback-modal');
    dom.submitFeedbackBody = document.getElementById('submit-feedback-body');
    dom.submitFeedbackOk = document.getElementById('submit-feedback-ok');
    // V1.4-PWA：数据备份按钮
    dom.btnExportData = document.getElementById('btn-export-data');
    dom.btnImportData = document.getElementById('btn-import-data');
    dom.importFileInput = document.getElementById('import-file-input');
  }

  // ========== 工具函数 ==========

  /** 显示 Toast 提示 */
  function showToast(message, type) {
    if (!dom.toast) return;
    dom.toast.textContent = message;
    dom.toast.className = 'toast show' + (type ? ' ' + type : '');
    clearTimeout(showToast._timer);
    showToast._timer = setTimeout(function () {
      dom.toast.className = 'toast';
    }, 2500);
  }

  /** 根据分数获取风险等级CSS类名 */
  function getRiskClass(score) {
    if (score >= 80) return 'risk-healthy';
    if (score >= 70) return 'risk-low';
    if (score >= 60) return 'risk-mid';
    return 'risk-high';
  }

  function getSummaryClass(score) {
    if (score >= 80) return 'summary-healthy';
    if (score >= 70) return 'summary-low';
    if (score >= 60) return 'summary-mid';
    return 'summary-high';
  }

  // ========== 日历模块（阶段二核心） ==========

  /** 渲染日历 */
  function renderCalendar() {
    if (!dom.calendarGrid) return;

    var grid = Core.getCalendarGrid(state.currentYear, state.currentMonth);
    var allRecords = Core.getAllRecords();

    dom.calendarTitle.textContent = Core.getMonthLabel(state.currentYear, state.currentMonth);
    dom.calendarGrid.innerHTML = '';

    for (var row = 0; row < grid.length; row++) {
      for (var col = 0; col < grid[row].length; col++) {
        var cell = grid[row][col];
        var cellEl = document.createElement('div');
        cellEl.className = 'calendar-cell';

        if (!cell.isCurrentMonth) {
          cellEl.classList.add('other-month');
        }
        if (cell.isToday) {
          cellEl.classList.add('today');
        }
        // V1.3 周一开头：周六(索引5)、周日(索引6)为周末
        if (col === 5 || col === 6) {
          cellEl.classList.add('cell-weekend');
        }

        // 日期数字
        var dateEl = document.createElement('div');
        dateEl.className = 'cell-date';
        dateEl.textContent = cell.date;
        cellEl.appendChild(dateEl);

        // 分数/无记录标识
        var scoreEl = document.createElement('div');
        var record = allRecords[cell.dateKey];

        if (record && typeof record.score === 'number') {
          scoreEl.className = 'cell-score ' + getRiskClass(record.score);
          scoreEl.textContent = record.score + '分';
        } else {
          scoreEl.className = 'cell-score no-record';
          scoreEl.textContent = '无记录';
        }
        cellEl.appendChild(scoreEl);

        // V1.4：有记录的日期，在分数下方显示症状文本（不计分，仅展示）
        if (record && record.symptom) {
          var symptomEl = document.createElement('div');
          var symptomCssClass = 'symptom-none';
          Core.SYMPTOM_OPTIONS.forEach(function (opt) {
            if (opt.value === record.symptom) {
              symptomCssClass = opt.cssClass;
            }
          });
          symptomEl.className = 'cell-symptom ' + symptomCssClass;
          symptomEl.textContent = record.symptom;
          cellEl.appendChild(symptomEl);
        }

        // V1.3 点击事件分支：
        // - 已有记录 → 打开只读详情弹窗
        // - 空白无记录 → 打开表单补录（含今日和历史日期）
        (function (dateKey, hasRecord) {
          cellEl.addEventListener('click', function () {
            if (hasRecord) {
              showDetailModal(dateKey);
            } else {
              showRecordView(dateKey);
            }
          });
        })(cell.dateKey, !!record);

        dom.calendarGrid.appendChild(cellEl);
      }
    }
  }

  /** 切换到上个月 */
  function prevMonth() {
    state.currentMonth--;
    if (state.currentMonth < 0) {
      state.currentMonth = 11;
      state.currentYear--;
    }
    renderCalendar();
  }

  /** 切换到下个月 */
  function nextMonth() {
    state.currentMonth++;
    if (state.currentMonth > 11) {
      state.currentMonth = 0;
      state.currentYear++;
    }
    renderCalendar();
  }

  /** 回到今天所在月份 */
  function goTodayMonth() {
    var today = new Date();
    state.currentYear = today.getFullYear();
    state.currentMonth = today.getMonth();
    renderCalendar();
  }

  // ========== 视图切换 ==========

  function showHomeView() {
    state.currentView = 'home';
    state.editingDateKey = null; // V1.3：返回首页时重置编辑日期
    dom.homeView.style.display = 'block';
    dom.recordView.classList.remove('active');
    renderCalendar(); // 回到首页时刷新日历
  }

  function showRecordView(dateKey) {
    // V1.3：支持指定日期编辑；不传则默认今日
    state.editingDateKey = dateKey || state.todayKey;
    state.currentView = 'record';
    dom.homeView.style.display = 'none';
    dom.recordView.classList.add('active');
    renderRecordForm();
  }

  // ========== 记录填报模块（阶段三） ==========

  /** 渲染记录表单（V1.3：支持指定日期编辑） */
  function renderRecordForm() {
    if (!dom.scoreItemsContainer) return;

    var editKey = state.editingDateKey || state.todayKey;
    var dateObj = Core.parseDateKey(editKey);
    var dateLabel = dateObj.getFullYear() + '年' + (dateObj.getMonth() + 1) + '月' + dateObj.getDate() + '日';

    // V1.3：区分今日/历史补录标题
    if (editKey === state.todayKey) {
      dom.recordDateLabel.textContent = dateLabel + '（今日记录，可反复修改）';
    } else {
      dom.recordDateLabel.textContent = dateLabel + '（历史补录，保存后锁定只读）';
    }

    // 读取指定日期已保存记录
    var dayRecord = Core.getRecord(editKey);
    var checkedMap = (dayRecord && dayRecord.checkedMap) ? dayRecord.checkedMap : {};

    // 按分类分组渲染
    var categories = {};
    Core.SCORE_ITEMS.forEach(function (item) {
      if (!categories[item.category]) {
        categories[item.category] = [];
      }
      categories[item.category].push(item);
    });

    dom.scoreItemsContainer.innerHTML = '';

    Object.keys(categories).forEach(function (catName) {
      var groupEl = document.createElement('div');
      groupEl.className = 'score-group';

      var titleEl = document.createElement('div');
      titleEl.className = 'score-group-title';
      titleEl.textContent = catName;
      groupEl.appendChild(titleEl);

      categories[catName].forEach(function (item) {
        var itemEl = document.createElement('label');
        itemEl.className = 'score-item' + (checkedMap[item.id] ? ' checked' : '');
        itemEl.setAttribute('data-item-id', item.id);

        var checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.checked = !!checkedMap[item.id];
        checkbox.setAttribute('data-item-id', item.id);

        var infoEl = document.createElement('div');
        infoEl.className = 'item-info';
        var nameEl = document.createElement('div');
        nameEl.className = 'item-name';
        nameEl.textContent = item.name;
        infoEl.appendChild(nameEl);

        var scoreEl = document.createElement('div');
        scoreEl.className = 'item-score';
        scoreEl.textContent = '+' + item.score + '分';

        itemEl.appendChild(checkbox);
        itemEl.appendChild(infoEl);
        itemEl.appendChild(scoreEl);

        // 勾选变化事件
        checkbox.addEventListener('change', function () {
          if (checkbox.checked) {
            itemEl.classList.add('checked');
          } else {
            itemEl.classList.remove('checked');
          }
          updateScoreDisplay();
        });

        groupEl.appendChild(itemEl);
      });

      dom.scoreItemsContainer.appendChild(groupEl);
    });

    // V1.4：渲染口腔溃疡症状单选组
    renderSymptomGroup(dayRecord);

    // 初始化分数显示
    updateScoreDisplay();
  }

  /** V1.4：渲染症状单选组 */
  function renderSymptomGroup(dayRecord) {
    if (!dom.symptomContainer) return;

    var savedSymptom = (dayRecord && dayRecord.symptom) ? dayRecord.symptom : '无';

    var html = '';
    html += '<div class="symptom-group-title">口腔溃疡症状（不计分，仅记录）</div>';
    html += '<div class="symptom-options">';
    Core.SYMPTOM_OPTIONS.forEach(function (opt) {
      var checked = (opt.value === savedSymptom) ? 'checked' : '';
      html += '<label class="symptom-option" data-symptom="' + opt.value + '">';
      html += '<input type="radio" name="symptom-radio" value="' + opt.value + '" ' + checked + '>';
      html += '<span class="symptom-label" style="color:' + opt.color + ';">' + opt.value + '</span>';
      html += '</label>';
    });
    html += '</div>';

    dom.symptomContainer.innerHTML = html;

    // 绑定单选变化事件（症状不计分，不需要触发计分更新）
    var radios = dom.symptomContainer.querySelectorAll('input[type="radio"]');
    radios.forEach(function (radio) {
      radio.addEventListener('change', function () {
        // 更新选中样式
        dom.symptomContainer.querySelectorAll('.symptom-option').forEach(function (opt) {
          opt.classList.remove('selected');
        });
        if (radio.checked) {
          radio.closest('.symptom-option').classList.add('selected');
        }
      });
    });

    // 初始化选中样式
    var checkedRadio = dom.symptomContainer.querySelector('input[type="radio"]:checked');
    if (checkedRadio) {
      checkedRadio.closest('.symptom-option').classList.add('selected');
    }
  }

  /** V1.4：获取当前表单选中的症状 */
  function getCurrentSymptom() {
    if (!dom.symptomContainer) return '无';
    var checked = dom.symptomContainer.querySelector('input[name="symptom-radio"]:checked');
    return checked ? checked.value : '无';
  }

  /** 获取当前表单勾选状态 */
  function getCurrentCheckedMap() {
    var checkboxes = dom.scoreItemsContainer.querySelectorAll('input[type="checkbox"]');
    var map = {};
    checkboxes.forEach(function (cb) {
      var id = cb.getAttribute('data-item-id');
      map[id] = cb.checked;
    });
    return map;
  }

  /** 更新分数显示 */
  function updateScoreDisplay() {
    var checkedMap = getCurrentCheckedMap();
    var score = Core.calculateScore(checkedMap);
    var risk = Core.getRiskLevel(score);

    dom.currentScore.textContent = score;
    dom.riskBadge.textContent = risk.level;
    dom.riskBadge.style.background = risk.bgColor;
    dom.riskBadge.style.color = risk.color;

    // 更新汇总条样式
    dom.scoreSummary.className = 'score-summary ' + getSummaryClass(score);
  }

  /** 保存记录（V1.3：保存到当前编辑日期；V1.4：保存后弹出反馈弹窗，确认后自动返回日历） */
  function saveTodayRecord() {
    var editKey = state.editingDateKey || state.todayKey;
    var checkedMap = getCurrentCheckedMap();
    var score = Core.calculateScore(checkedMap);
    var risk = Core.getRiskLevel(score);
    var symptom = getCurrentSymptom();

    var success = Core.saveRecord(editKey, {
      checkedMap: checkedMap,
      score: score,
      riskLevel: risk.level,
      symptom: symptom
    });

    if (success) {
      // V1.4：保存成功后弹出反馈弹窗，不再用toast
      showSubmitFeedbackModal(score, risk, checkedMap, editKey);
    } else {
      showToast('保存失败，请重试', 'error');
    }

    return { success: success, score: score, risk: risk, symptom: symptom, checkedMap: checkedMap };
  }

  /** V1.4：显示提交成功反馈弹窗 */
  function showSubmitFeedbackModal(score, risk, checkedMap, dateKey) {
    if (!dom.submitFeedbackModal) return;

    var html = '';

    // 分数行
    html += '<div class="feedback-score-row" style="background:' + risk.bgColor + ';">';
    html += '<div>';
    html += '<div class="feedback-score-num" style="color:' + risk.color + ';">' + score + '分</div>';
    html += '<div style="font-size:12px;color:' + risk.color + ';opacity:0.8;">健康评分（满分100）</div>';
    html += '</div>';
    html += '<div class="feedback-risk-badge" style="color:' + risk.color + ';">';
    html += risk.level;
    html += '</div>';
    html += '</div>';

    // 未达标项提醒
    var uncheckedItems = [];
    Core.SCORE_ITEMS.forEach(function (item) {
      if (!checkedMap[item.id]) {
        uncheckedItems.push(item.name);
      }
    });

    if (uncheckedItems.length > 0) {
      html += '<div class="feedback-unchecked-title">未达标项目提醒：</div>';
      html += '<ul class="feedback-unchecked-list">';
      uncheckedItems.forEach(function (name) {
        html += '<li>' + name + '</li>';
      });
      html += '</ul>';
    } else {
      html += '<div class="feedback-all-pass">🎉 所有项目均达标，继续保持！</div>';
    }

    dom.submitFeedbackBody.innerHTML = html;
    dom.submitFeedbackModal.classList.add('active');
  }

  /** V1.4：关闭提交反馈弹窗，自动返回日历 */
  function closeSubmitFeedbackModal() {
    if (!dom.submitFeedbackModal) return;
    dom.submitFeedbackModal.classList.remove('active');
    // V1.4：关闭后自动返回日历界面
    showHomeView();
  }

  // ========== V1.4-PWA新增：数据备份与恢复 ==========

  /** 导出全部记录为JSON文件 */
  function exportData() {
    try {
      var allRecords = Core.getAllRecords();
      var exportObj = {
        app: '口腔溃疡预防健康管理',
        version: 'V1.4-PWA',
        exportTime: new Date().toISOString(),
        recordCount: Object.keys(allRecords).length,
        records: allRecords
      };
      var jsonStr = JSON.stringify(exportObj, null, 2);
      var blob = new Blob([jsonStr], { type: 'application/json' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      var dateStr = new Date().toISOString().slice(0, 10);
      a.href = url;
      a.download = 'oral-health-records-' + dateStr + '.json';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast('导出成功，共 ' + Object.keys(allRecords).length + ' 条记录', 'success');
      return true;
    } catch (e) {
      showToast('导出失败：' + e.message, 'error');
      return false;
    }
  }

  /** 触发导入文件选择 */
  function triggerImport() {
    if (dom.importFileInput) {
      dom.importFileInput.value = '';
      dom.importFileInput.click();
    }
  }

  /** 处理导入文件 */
  function handleImportFile(event) {
    var file = event.target.files[0];
    if (!file) return;

    var reader = new FileReader();
    reader.onload = function (e) {
      try {
        var content = e.target.result;
        var data = JSON.parse(content);

        // 验证文件格式
        if (!data.records || typeof data.records !== 'object') {
          showToast('导入失败：文件格式不正确', 'error');
          return;
        }

        // 确认覆盖
        var recordCount = Object.keys(data.records).length;
        var confirmMsg = '即将导入 ' + recordCount + ' 条记录，将覆盖当前所有数据，是否继续？';
        if (!window.confirm(confirmMsg)) {
          showToast('已取消导入', 'error');
          return;
        }

        // 清空现有记录并导入
        Core.clearAllRecords();
        var records = data.records;
        for (var dateKey in records) {
          if (records.hasOwnProperty(dateKey)) {
            var rec = records[dateKey];
            Core.saveRecord(dateKey, {
              checkedMap: rec.checkedMap || {},
              score: typeof rec.score === 'number' ? rec.score : 0,
              riskLevel: rec.riskLevel || '',
              symptom: rec.symptom || '无'
            });
          }
        }

        // 刷新日历
        renderCalendar();
        showToast('导入成功，共 ' + recordCount + ' 条记录', 'success');
      } catch (err) {
        showToast('导入失败：文件解析错误', 'error');
      }
    };
    reader.onerror = function () {
      showToast('导入失败：文件读取错误', 'error');
    };
    reader.readAsText(file);
  }

  /** 注册Service Worker（PWA离线支持） */
  function registerServiceWorker() {
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').then(function (registration) {
          console.log('ServiceWorker注册成功，作用域：', registration.scope);
        }).catch(function (err) {
          console.log('ServiceWorker注册失败（本地file协议下属正常现象）：', err);
        });
      });
    }
  }

  // ========== 历史记录弹窗模块（阶段四） ==========

  /** 显示详情弹窗 */
  function showDetailModal(dateKey) {
    if (!dom.detailModal) return;

    var dateObj = Core.parseDateKey(dateKey);
    var dateLabel = dateObj.getFullYear() + '年' + (dateObj.getMonth() + 1) + '月' + dateObj.getDate() + '日';
    dom.modalTitle.textContent = dateLabel + ' 健康记录';

    var record = Core.getRecord(dateKey);

    if (!record) {
      // 空数据兜底
      dom.modalBody.innerHTML =
        '<div class="empty-state">' +
        '<div class="empty-icon">📋</div>' +
        '<p>该日期暂无健康记录</p>' +
        '</div>';
    } else {
      // 完整数据展示
      var risk = Core.getRiskLevel(record.score);
      var html = '';

      // 分数行
      html += '<div class="detail-score-row" style="background:' + risk.bgColor + ';">';
      html += '<div>';
      html += '<div class="detail-score-num" style="color:' + risk.color + ';">' + record.score + '分</div>';
      html += '<div style="font-size:12px;color:' + risk.color + ';opacity:0.8;">健康评分（满分100）</div>';
      html += '</div>';
      html += '<div style="text-align:right;">';
      html += '<div style="font-size:16px;font-weight:700;color:' + risk.color + ';background:#fff;padding:8px 18px;border-radius:20px;">';
      html += risk.level;
      html += '</div>';
      // V1.4：详情弹窗增加症状展示
      if (record.symptom) {
        var symptomColor = '#2ecc71';
        Core.SYMPTOM_OPTIONS.forEach(function (opt) {
          if (opt.value === record.symptom) symptomColor = opt.color;
        });
        html += '<div style="font-size:13px;font-weight:600;color:' + symptomColor + ';margin-top:8px;">';
        html += '症状：' + record.symptom;
        html += '</div>';
      }
      html += '</div>';
      html += '</div>';

      // 9项指标列表
      html += '<div class="detail-items-list">';
      Core.SCORE_ITEMS.forEach(function (item) {
        var done = record.checkedMap && record.checkedMap[item.id] === true;
        html += '<div class="detail-item">';
        html += '<div class="detail-status ' + (done ? 'done' : 'undone') + '">' + (done ? '✓' : '○') + '</div>';
        html += '<div class="detail-item-name" style="' + (done ? '' : 'opacity:0.6;') + '">' + item.name + '</div>';
        html += '<div class="detail-item-score">' + (done ? '+' + item.score + '分' : '未达标') + '</div>';
        html += '</div>';
      });
      html += '</div>';

      dom.modalBody.innerHTML = html;
    }

    dom.detailModal.classList.add('active');
  }

  /** 关闭弹窗 */
  function closeDetailModal() {
    if (dom.detailModal) {
      dom.detailModal.classList.remove('active');
    }
  }

  // ========== 事件绑定 ==========

  function bindEvents() {
    // 日历导航
    dom.btnPrevMonth.addEventListener('click', prevMonth);
    dom.btnNextMonth.addEventListener('click', nextMonth);
    dom.btnTodayMonth.addEventListener('click', goTodayMonth);

    // 视图切换
    dom.btnGoRecord.addEventListener('click', showRecordView);
    dom.btnBackHome.addEventListener('click', showHomeView);

    // 保存记录
    dom.btnSaveRecord.addEventListener('click', saveTodayRecord);

    // 弹窗关闭
    dom.modalClose.addEventListener('click', closeDetailModal);
    dom.modalOk.addEventListener('click', closeDetailModal);

    // V1.4：提交反馈弹窗确认按钮
    if (dom.submitFeedbackOk) {
      dom.submitFeedbackOk.addEventListener('click', closeSubmitFeedbackModal);
    }

    // 点击遮罩关闭历史详情弹窗（V1.4：提交反馈弹窗不允许点击遮罩关闭，必须点确定按钮）
    dom.detailModal.addEventListener('click', function (e) {
      if (e.target === dom.detailModal) {
        closeDetailModal();
      }
    });

    // ESC 键关闭弹窗
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && dom.detailModal.classList.contains('active')) {
        closeDetailModal();
      }
    });

    // V1.4-PWA：数据备份按钮
    if (dom.btnExportData) {
      dom.btnExportData.addEventListener('click', exportData);
    }
    if (dom.btnImportData) {
      dom.btnImportData.addEventListener('click', triggerImport);
    }
    if (dom.importFileInput) {
      dom.importFileInput.addEventListener('change', handleImportFile);
    }
  }

  // ========== 初始化 ==========

  function init() {
    initDom();

    // V1.4：只在第一次加载V1.4版本时清空旧版本数据，之后刷新/重开不再清空
    // 用版本标记控制，确保数据持久化
    var versionKey = 'oral_care_app_version';
    var currentVersion = 'v1.4';
    try {
      var storage = (typeof window !== 'undefined' && window.localStorage) ? window.localStorage : null;
      var storedVersion = storage ? storage.getItem(versionKey) : null;
      if (storedVersion !== currentVersion) {
        Core.clearAllRecords();
        if (storage) storage.setItem(versionKey, currentVersion);
        console.log('V1.4首次加载，旧版本数据已清空');
      }
    } catch (e) {
      Core.clearAllRecords();
    }

    bindEvents();
    renderCalendar();
    // V1.4-PWA：注册Service Worker实现离线支持
    registerServiceWorker();
    console.log('口腔溃疡预防健康管理APP V1.4-PWA 已启动');
  }

  // DOM 就绪后初始化
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }

  // 暴露给测试用
  window.OralCareApp = {
    state: state,
    dom: dom,
    init: init,
    renderCalendar: renderCalendar,
    prevMonth: prevMonth,
    nextMonth: nextMonth,
    goTodayMonth: goTodayMonth,
    showDetailModal: showDetailModal,
    closeDetailModal: closeDetailModal,
    showSubmitFeedbackModal: showSubmitFeedbackModal,
    closeSubmitFeedbackModal: closeSubmitFeedbackModal,
    getCurrentCheckedMap: getCurrentCheckedMap,
    getCurrentSymptom: getCurrentSymptom,
    updateScoreDisplay: updateScoreDisplay,
    saveTodayRecord: saveTodayRecord,
    renderRecordForm: renderRecordForm,
    renderSymptomGroup: renderSymptomGroup,
    showHomeView: showHomeView,
    showRecordView: showRecordView,
    exportData: exportData,
    triggerImport: triggerImport,
    handleImportFile: handleImportFile,
    registerServiceWorker: registerServiceWorker
  };
})();

</script>
</body>
</html>
